[package]
name = "xgboost_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", optional = true }
bytemuck = { version = "1", optional = true }
# No backend is selected here: the `cpu` / `vulkan` / `cuda` features below turn
# them on, and `src/gpu/mod.rs` resolves which one a build actually runs.
cubecl = { version = "0.10.0", optional = true }
# The CUDA driver API beside CubeCL's runtime, for one thing the runtime does
# slowly: `gpu::tables::upload_vec` copies host memory to a buffer through
# the driver directly. Same features as `cubecl-cuda` asks for, so the two
# resolve to one build of the crate.
cudarc = { version = "0.19", optional = true, default-features = false, features = [
    "std", "driver", "fallback-dynamic-loading", "cuda-version-from-build-system", "fallback-latest",
] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.19"

[features]
# The kernels build against the CubeCL CPU runtime out of the box, so a plain
# `cargo build`/`cargo test` compiles and runs every kernel on any machine.
# `vulkan` and `cuda` add the accelerator backends, which need a toolchain
# (on macOS, the Vulkan SDK).
default = ["gpu", "cpu"]

# The CubeCL kernels and everything that depends on them. On its own this
# feature brings in no backend at all: pair it with exactly one of `cpu`,
# `vulkan` or `cuda`, or take `default`. CPU-only consumers can opt out with
# `--no-default-features` and still get `parameters`.
gpu = ["dep:anyhow", "dep:bytemuck", "dep:cubecl"]

# The three backends the kernels run on. They can be enabled together — the
# ladder in `src/gpu/mod.rs` picks `cuda` over `vulkan` over `cpu`, and
# `gpu::BACKEND` names the winner — but each one that is on has to build.
cpu = ["gpu", "cubecl/cpu"]
# wgpu with SPIR-V passthrough, not WGSL: the kernels use i64/f64, which the
# WGSL compiler cannot express. Needs the Vulkan SDK on macOS.
vulkan = ["gpu", "cubecl/vulkan"]
# wgpu with Metal Shading Language, the native macOS path — no SDK to install.
# Same `WgpuRuntime` as `vulkan`; the shader compiler is chosen from the
# adapter, which `AutoGraphicsApi` resolves to Metal on macOS.
metal = ["gpu", "cubecl/wgpu-msl"]
cuda = ["gpu", "cubecl/cuda", "dep:cudarc"]

[[bin]]
name = "xgboost_rs"
path = "src/main.rs"
required-features = ["gpu"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["gpu"]

# Timing sweep over the fit parameters that change how much work a fit does.
# CPU only, so it builds without a GPU toolchain.
[[bin]]
name = "param_bench"
path = "src/bin/param_bench.rs"

[[test]]
name = "kernels"
path = "tests/kernels.rs"
required-features = ["gpu"]

[[test]]
name = "parameters"
path = "tests/parameters.rs"

[[test]]
name = "gpu_split_eval"
path = "tests/gpu_split_eval.rs"
required-features = ["gpu"]

[[test]]
name = "gpu_row_partition"
path = "tests/gpu_row_partition.rs"
required-features = ["gpu"]

[[test]]
name = "gpu_frontier"
path = "tests/gpu_frontier.rs"
required-features = ["gpu"]

[[test]]
name = "gpu_grower"
path = "tests/gpu_grower.rs"
required-features = ["gpu"]

[[test]]
name = "gpu_training"
path = "tests/gpu_training.rs"
required-features = ["gpu"]

[[test]]
name = "gpu_linear"
path = "tests/gpu_linear.rs"
required-features = ["gpu"]
