[package]
name = "xgboost_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", optional = true }
bytemuck = { version = "1", optional = true }
# `vulkan` (wgpu + SPIR-V passthrough) is required: the kernels use i64/f64,
# which the WGSL compiler cannot express.
cubecl = { version = "0.10.0", features = ["vulkan"], optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.19"

[features]
default = ["gpu"]
# The CubeCL kernels and everything that depends on them. Building them needs a
# CubeCL backend toolchain (on macOS, the Vulkan SDK), so CPU-only consumers can
# opt out with `--no-default-features` and still get `parameters`.
gpu = ["dep:anyhow", "dep:bytemuck", "dep:cubecl"]
cuda = ["gpu", "cubecl/cuda"]

[[bin]]
name = "xgboost_rs"
path = "src/main.rs"
required-features = ["gpu"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["gpu"]

# Timing sweep over the fit parameters that change how much work a fit does.
# CPU only, so it builds without a GPU toolchain.
[[bin]]
name = "param_bench"
path = "src/bin/param_bench.rs"

[[test]]
name = "kernels"
path = "tests/kernels.rs"
required-features = ["gpu"]

[[test]]
name = "parameters"
path = "tests/parameters.rs"

[[test]]
name = "gpu_split_eval"
path = "tests/gpu_split_eval.rs"
required-features = ["gpu"]

[[test]]
name = "gpu_row_partition"
path = "tests/gpu_row_partition.rs"
required-features = ["gpu"]

[[test]]
name = "gpu_frontier"
path = "tests/gpu_frontier.rs"
required-features = ["gpu"]
